# school-library — Nginx reverse-proxy template (Step 13B)
#
# Repository template only — NOT installed on any server by this step.
# To use on the real VPS (a later, manual step):
#   sudo cp deploy/nginx/school-library.conf /etc/nginx/sites-available/school-library
#   sudo ln -s /etc/nginx/sites-available/school-library /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN below with the real domain before use — never commit
# a real production domain to this template.
#
# HTTPS is intentionally NOT configured here. This is HTTP-only, compatible
# with adding HTTPS later (Step VPS-21 / Certbot) — see the commented block
# at the bottom for where that goes. Do not treat this file as providing
# HTTPS; it does not.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Upload size ceiling — must stay slightly ABOVE the application's
    # MAX_UPLOAD_SIZE_MB (see /etc/school-library/production.env and
    # README's Production section), or Nginx will reject large uploads with
    # its own 413 before the app's friendly validation ever runs. Current
    # application default is 10 MB; 12M gives headroom for multipart
    # overhead. Nginx cannot read the app's env file directly — if
    # MAX_UPLOAD_SIZE_MB changes, this value must be updated here too, by
    # hand, and Nginx reloaded.
    client_max_body_size 12M;

    # All document preview/download/upload traffic is proxied to the app —
    # /var/lib/school-library/storage (the STORAGE_ROOT) is deliberately
    # NOT exposed via any location block here. There is no static file
    # serving of uploaded content; Next.js's own preview/download routes
    # (which enforce auth and containment checks — see README's Preview/
    # Download sections) are the only path to that data.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard reverse-proxy headers for Next.js — harmless even though
        # this app doesn't currently use WebSockets/HMR in production.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- HTTPS placeholder (later step — do not uncomment without a real
    # certificate for YOUR_DOMAIN already issued, e.g. via Certbot) ---
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     server_name YOUR_DOMAIN;
    #
    #     ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    #
    #     client_max_body_size 12M;
    #     location / {
    #         proxy_pass http://127.0.0.1:3000;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #     }
    # }
    #
    # # Once the above is live, this HTTP server block would typically
    # # redirect to HTTPS instead of proxying directly:
    # #   return 301 https://$host$request_uri;
}
